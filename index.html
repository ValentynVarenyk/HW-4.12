
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таймер зворотного відліку</title>
</head>
<body>
  <form class="timer-form">
  <input
    class="timer-input"
    type="number"
    name="timeCalculator"
    placeholder="Введи час у секундах"
    min="1"
    required
  >

  <button class="timer-button" type="submit">
    Запустити таймер
  </button>
</form>

<div class="timer" id="timer-1">
  <div class="field">
    <span class="days-value" data-value="days">0</span>
    <span class="days-label">Дні</span>
  </div>

  <div class="field">
    <span class="hours-value" data-value="hours">00</span>
    <span class="hours-label">Години</span>
  </div>

  <div class="field">
    <span class="mins-value" data-value="mins">00</span>
    <span class="mins-label">Хвилини</span>
  </div>

  <div class="field">
    <span class="secs-value" data-value="secs">00</span>
    <span class="secs-label">Секунди</span>
  </div>
</div>

  <script src="./script.js" type="module"></script>
</body>
</html>
